<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>江湖鏢局金庫</title>
<meta name="description" content="江湖鏢局的點數金庫與 NFT 資訊：查看各幣種池子、匯率，連接錢包領取兌換。">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#2b2622;--muted:#7a7068;--line:#e3dccf;--accent:#a8322d;--ok:#2e7d4f;--warn:#b26a00;--chip:#efe8db}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171412;--card:#211d1a;--ink:#efe8de;--muted:#a59a8e;--line:#3a332d;--accent:#e0625a;--ok:#5cc28a;--warn:#e7a443;--chip:#2c2622}}
:root[data-theme="dark"]{--bg:#171412;--card:#211d1a;--ink:#efe8de;--muted:#a59a8e;--line:#3a332d;--accent:#e0625a;--ok:#5cc28a;--warn:#e7a443;--chip:#2c2622}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{max-width:960px;margin:0 auto;padding:28px 16px 8px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:.04em}
h1 small{display:block;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
main{max-width:960px;margin:0 auto;padding:8px 16px 48px;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
button{border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;padding:10px 16px;cursor:pointer}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button[disabled]{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pool{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.pool .sym{font-size:18px;font-weight:700}
.pool .rate{font-size:20px;font-weight:700;color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
code{font-size:12px;word-break:break-all}
a{color:var(--accent)}
#msg{min-height:1.5em;margin-top:8px}
.ok{color:var(--ok)}.err{color:var(--accent)}.warn{color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nft{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.nft img{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--chip)}
ol{padding-left:20px;margin:0}
footer{max-width:960px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>江湖鏢局金庫<small>點數兌換・NFT 信物</small></h1>
  <div class="row"><span id="who" class="muted"></span><button id="connect">連接錢包</button></div>
</header>
<main>
  <section>
    <h2>金庫池子</h2>
    <p class="muted" id="rateNote">每點價值＝池子未分配餘額 ÷ 全服點數。兌換時點數銷毀，匯率不變；新點數稀釋匯率，總鏢頭存款時回升。</p>
    <div class="grid" id="pools"><p class="muted">讀取中…</p></div>
    <p class="muted" id="limits"></p>
  </section>
  <section>
    <h2>領取門檻</h2>
    <p class="muted">要持有下列任一種 NFT 的錢包才能領取（清單是空的代表沒有門檻）。門檻由總鏢頭在 Discord 管理，並同步到合約。</p>
    <div id="gates" class="muted">讀取中…</div>
  </section>
  <section id="mine" hidden>
    <h2>我的兌換</h2>
    <p id="gateWarn" class="warn" hidden></p>
    <div class="grid" id="owed"></div>
    <div class="row" style="margin-top:12px"><button id="claimAll" disabled>全部領取</button></div>
    <p id="msg"></p>
  </section>
  <section>
    <h2>NFT 信物</h2>
    <div class="nft">
      <img id="nftImg" alt="我的 NFT" hidden>
      <div style="flex:1;min-width:220px">
        <div class="kv"><span>已鑄造</span><span id="minted">—</span></div>
        <div class="bar" style="margin:6px 0 10px"><i id="mintBar" style="width:0"></i></div>
        <div class="kv"><span>白名單鑄造</span><span id="wlOpen">—</span></div>
        <div class="kv" id="myNftRow" hidden><span>我的狀態</span><span id="myNft">—</span></div>
        <div class="row" style="margin-top:10px"><button id="mint" hidden>白名單鑄造（免費）</button></div>
        <p class="muted" id="nftMsg"></p>
      </div>
    </div>
  </section>
  <section>
    <h2>怎麼兌換</h2>
    <ol class="muted">
      <li>在 Discord 完成江湖晉升、綁定錢包</li>
      <li>在「💱｜點數兌換」申請，選擇要換的幣種</li>
      <li>總鏢頭確認後，回到這裡連接錢包按「領取」</li>
    </ol>
  </section>
</main>
<footer id="foot"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
