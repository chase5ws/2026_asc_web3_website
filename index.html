<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>江湖鏢局金庫</title>
<meta name="description" content="江湖鏢局的鏈上金庫：即時幣值、用 ASC 兌換代幣、綁定錢包、信物 NFT、鏢局故事。">
<meta name="theme-color" content="#070d1f">
<meta property="og:title" content="江湖鏢局金庫">
<meta property="og:description" content="科技江湖・鏈上鏢局：持有越久，換得越多。">
<meta property="og:image" content="./assets/og.jpg">
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared/style.css">
</head>
<body data-page="home" data-root="./">
<main class="page">
  <section class="screen center-text">
    <div class="eyebrow reveal" data-i18n="home.eyebrow"></div>
    <h1 class="display reveal d1" data-i18n-html="home.title"></h1>
    <div class="reveal d2"><div class="hero-price" id="hPrice">—</div><div class="small muted" id="hUnit" style="margin-top:8px"></div></div>
    <div class="delta reveal d2" id="hDelta">&nbsp;</div>
    <div class="row reveal d3" style="justify-content:center"><span class="live"></span><span class="small muted" id="tick" data-i18n="tick.connecting"></span></div>
  </section>

  <section class="screen">
    <div class="reveal"><div class="eyebrow" data-i18n="home.poolsEyebrow"></div><h2 class="display" style="font-size:clamp(28px,4.6vw,52px)" data-i18n="home.poolsTitle"></h2></div>
    <p class="lead reveal d1" data-i18n="home.poolsLead"></p>
    <div class="tabs" id="tokenTabs"></div>
    <div class="market reveal d2">
      <div class="card side">
        <div class="coin"><span class="icon asc"><img src="assets/asc.png" alt="" onerror="this.remove()">ASC</span><div><b data-i18n="m.ascTitle"></b><div class="small muted" data-i18n="m.ascSub"></div></div></div>
        <div class="big" id="mSupply">—</div>
        <div class="tank asc"><i id="tankAsc" style="height:0"></i><div class="lbl"><span data-i18n="m.circ"></span><span id="mIssued"></span></div></div>
        <div class="kv"><span data-i18n="m.issued"></span><b id="mIssued2">—</b></div>
        <div class="kv"><span data-i18n="m.burned"></span><b id="mBurned">—</b></div>
      </div>
      <div class="card center glow">
        <div class="small muted" data-i18n="m.priceLabel"></div>
        <div class="price" id="mPrice">—</div>
        <div class="delta" id="mDelta">&nbsp;</div>
        <div class="flow"><span>ASC</span><span class="dots"><i></i><i></i><i></i><i></i></span><span id="mSym">—</span></div>
        <svg class="chart" id="chart" viewBox="0 0 600 170" preserveAspectRatio="none"></svg>
        <div class="range"><span id="cFrom"></span><span id="cInfo"></span><span id="cTo"></span></div>
        <div class="small muted" id="m100">—</div>
      </div>
      <div class="card side">
        <div class="coin"><span class="icon tok" id="tokIcon">—</span><div><b id="tName">—</b><div class="small muted" data-i18n="m.poolSub"></div></div></div>
        <div class="big" id="mAvail">—</div>
        <div class="tank tok"><i id="tankTok" style="height:0"></i><div class="lbl"><span data-i18n="m.avail"></span><span id="mBal"></span></div></div>
        <div class="mix" id="mix"></div>
        <div class="legend"><span><b style="background:var(--blue)"></b><span data-i18n="m.avail"></span></span><span><b style="background:var(--gold)"></b><span data-i18n="m.reserve"></span></span><span><b style="background:var(--red)"></b><span data-i18n="m.locked"></span></span></div>
      </div>
    </div>
  </section>

  <section class="screen short">
    <div class="eyebrow reveal" data-i18n="home.statsEyebrow"></div>
    <div class="stats reveal d1">
      <div class="stat"><span data-i18n="stat.supply"></span><b id="sSupply">—</b></div>
      <div class="stat"><span data-i18n="stat.pool"></span><b id="sPool">—</b></div>
      <div class="stat"><span data-i18n="stat.open"></span><b id="sOpen">—</b></div>
      <div class="stat"><span data-i18n="stat.end"></span><b id="sEnd">—</b></div>
    </div>
  </section>

  <section class="screen">
    <div class="reveal"><div class="eyebrow" data-i18n="home.exploreEyebrow"></div><h2 class="display" style="font-size:clamp(28px,4.6vw,52px)" data-i18n="home.exploreTitle"></h2></div>
    <div class="tiles">
      <a class="tile reveal" href="wallet/"><span class="bg" style="background-image:linear-gradient(135deg,#e0313f55,#0000)"></span><h3 data-i18n="tile.wallet"></h3><p data-i18n="tile.walletText"></p></a>
      <a class="tile reveal d1" href="story/"><span class="bg" style="background-image:url(assets/story-samurai.jpg)"></span><h3 data-i18n="tile.story"></h3><p data-i18n="tile.storyText"></p></a>
      <a class="tile reveal" href="rules/"><span class="bg" style="background-image:linear-gradient(135deg,#3d8bff55,#0000)"></span><h3 data-i18n="tile.rules"></h3><p data-i18n="tile.rulesText"></p></a>
      <a class="tile reveal d1" href="nft/"><span class="bg" style="background-image:url(assets/story-qi.jpg)"></span><h3 data-i18n="tile.nft"></h3><p data-i18n="tile.nftText"></p></a>
    </div>
  </section>
</main>
<footer><div id="foot"></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="./config.js"></script>
<script src="./shared/lang.js"></script>
<script src="./shared/core.js"></script>
<script src="home.js"></script>
</body>
</html>
