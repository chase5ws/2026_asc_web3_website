# 部署到 GitHub Pages：在 repo 的 Settings → Pages → Source 選「GitHub Actions」
# 私人 repo 需要 GitHub Pro／Team 才能開 Pages；沒有的話請看 README 的其他免費主機做法
name: 部署網頁
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 只放網頁檔案
        run: mkdir _site && cp index.html config.js _site/ && cp -r app assets bind terms privacy _site/
      # 活動徽章一次性部署頁：https://chase5ws.github.io/2026_asc_web3_website/badges-deploy/
      # 要先在 contracts-asc/badges 跑 npm run build 產生 build.json 並 commit；部署完、Safe 接手後把這兩行刪掉
      - name: 活動徽章部署頁
        run: if [ -f contracts-asc/badges/build.json ]; then mkdir -p _site/badges-deploy && cp contracts-asc/badges/deploy.html _site/badges-deploy/index.html && cp contracts-asc/badges/build.json _site/badges-deploy/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
