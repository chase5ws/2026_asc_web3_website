# 部署到 GitHub Pages：在 repo 的 Settings → Pages → Source 選「GitHub Actions」
# 私人 repo 需要 GitHub Pro／Team 才能開 Pages；沒有的話請看 README 的其他免費主機做法
name: 部署網頁
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 只放網頁檔案
        run: mkdir _site && cp index.html config.js _site/ && cp -r app assets bind terms privacy _site/
      # 活動徽章（contracts-asc/badges）：GitHub 上自動跑測試、編譯，通過才發布一次性部署頁
      #   https://chase5ws.github.io/2026_asc_web3_website/badges-deploy/
      #   測試結果看 Actions 這一步的紀錄；測試失敗只是不發布部署頁，網站照常更新
      #   部署完、Safe 接手後，把下面三個步驟刪掉
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 活動徽章：測試與編譯
        id: badges
        continue-on-error: true
        working-directory: contracts-asc/badges
        run: npm install --no-audit --no-fund && npx hardhat test && npm run build
      - name: 活動徽章：發布部署頁
        if: steps.badges.outcome == 'success'
        run: mkdir -p _site/badges-deploy && cp contracts-asc/badges/deploy.html _site/badges-deploy/index.html && cp contracts-asc/badges/build.json contracts-asc/badges/verify-badges.json contracts-asc/badges/EventBadges.abi.json _site/badges-deploy/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
