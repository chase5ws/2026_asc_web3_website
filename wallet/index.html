<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>江湖鏢局金庫</title>
<meta name="description" content="江湖鏢局的鏈上金庫：即時幣值、用 ASC 兌換代幣、綁定錢包、信物 NFT、鏢局故事。">
<meta name="theme-color" content="#070d1f">
<meta property="og:title" content="江湖鏢局金庫">
<meta property="og:description" content="科技江湖・鏈上鏢局：持有越久，換得越多。">
<meta property="og:image" content="../assets/og.jpg">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body data-page="wallet" data-root="../">
<main class="page">
  <section class="screen">
    <div class="eyebrow reveal" data-i18n="wallet.eyebrow"></div>
    <h1 class="display reveal d1" data-i18n-html="wallet.title"></h1>
    <p class="lead reveal d2" data-i18n="wallet.lead"></p>
    <div class="card reveal d3" id="mineLocked"><div class="row" style="justify-content:space-between"><span class="muted" data-i18n="mine.locked"></span><button class="blue" id="connect2" data-i18n="connect"></button></div></div>
    <div id="mineTop" hidden>
      <div class="grid3">
        <div class="card reveal"><div class="small muted" data-i18n="mine.asc"></div><div class="big" id="myAsc">—</div><div class="small muted" id="myAddr"></div></div>
        <div class="card reveal d1"><div class="small muted" data-i18n="mine.days"></div><div class="big"><span id="myDays">—</span> <span class="small muted" data-i18n="mine.dayUnit"></span>・<span id="myKeep">—</span></div><div class="progress" style="margin-top:8px"><i id="myProg" style="width:0"></i></div><div class="small muted" id="myNext" style="margin-top:6px"></div></div>
        <div class="card reveal d2"><div class="small muted" data-i18n="mine.all"></div><div class="big" id="myAll">—</div><div class="small muted" id="myLeft"></div></div>
      </div>
      <div class="tiers reveal d3" id="tiers" style="margin-top:14px"></div>
      <p class="warn small" id="gateWarn" hidden></p>
    </div>
  </section>

  <section class="screen" id="actions" hidden>
    <div class="reveal"><div class="eyebrow" data-i18n="wallet.actEyebrow"></div><h2 class="display" style="font-size:clamp(28px,4.6vw,52px)" data-i18n="wallet.actTitle"></h2></div>
    <div class="grid2">
      <div class="card glow reveal">
        <h3 data-i18n="ex.title"></h3>
        <p class="small muted" data-i18n="ex.desc"></p>
        <div class="grid2">
          <label><span data-i18n="ex.token"></span><select id="exToken"></select></label>
          <label><span data-i18n="ex.points"></span><input id="exPoints" type="number" min="1" step="1" inputmode="numeric" data-i18n-ph="ex.pointsPh"></label>
        </div>
        <div class="row small" style="margin:8px 0"><button class="alt" data-fill="min" data-i18n="ex.min"></button><button class="alt" data-fill="max" data-i18n="ex.max"></button><button class="alt" data-fill="all" data-i18n="ex.all"></button></div>
        <div class="preview" id="exPreview"></div>
        <div style="margin-top:10px"><button id="exGo" disabled data-i18n="ex.title"></button></div>
        <p class="msg" id="exMsg"></p>
      </div>
      <div class="card reveal d1">
        <h3 data-i18n="tx.title"></h3>
        <p class="small muted" data-i18n-html="tx.desc"></p>
        <label><span data-i18n="tx.to"></span><input id="txTo" placeholder="0x…" autocomplete="off" spellcheck="false"></label>
        <label style="margin-top:8px"><span data-i18n="tx.amount"></span><input id="txAmt" type="number" min="1" step="1" inputmode="numeric" data-i18n-ph="tx.amountPh"></label>
        <div style="margin-top:10px"><button class="blue" id="txGo" disabled data-i18n="tx.go"></button></div>
        <p class="msg" id="txMsg"></p>
      </div>
    </div>
  </section>

  <section class="screen" id="donate">
    <div class="card glow reveal" style="max-width:640px">
      <h3 data-i18n="donate.title"></h3>
      <p class="small muted" data-i18n-html="donate.desc"></p>
      <label><span data-i18n="donate.amount"></span><input id="donateAmt" type="number" min="0" step="0.1" inputmode="decimal" placeholder="10"></label>
      <div class="small muted" id="donateBal" style="margin-top:6px"></div>
      <div style="margin-top:10px"><button id="donateGo" data-i18n="donate.go"></button></div>
      <p class="msg" id="donateMsg"></p>
    </div>
  </section>
  <a class="next reveal" href="../story/"><span><small data-i18n="next">下一頁</small><b data-i18n="page.story"></b></span><span class="arrow">→</span></a>
</main>
<footer><div id="foot"></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="../config.js"></script>
<script src="../shared/lang.js"></script>
<script src="../nft/v2-lang.js"></script>
<script src="../shared/core.js"></script>
<script src="page.js"></script>
<script src="donate.js"></script>
</body>
</html>
